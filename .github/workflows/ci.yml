name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.82.1
          locked: true
      - name: Unit tests
        run: pixi run --locked test
      - name: Ruff lint
        run: pixi run --locked lint
      - name: Ruff format
        run: pixi run --locked format-check
